<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bookmarks</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #111827;
}

button,
input {
    font: inherit;
}

/* =========================
   AUTH SCREEN
========================= */

.auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.auth-card h1 {
    margin: 0;
    font-size: 28px;
}

.auth-subtitle {
    color: #6b7280;
    margin: 8px 0 25px;
    font-size: 14px;
}

.auth-tabs {
    display: flex;
    background: #f3f4f6;
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.auth-tab {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    color: #6b7280;
}

.auth-tab.active {
    background: white;
    color: #111827;
    font-weight: 600;
    box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.auth-input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    margin-bottom: 12px;
    outline: none;
}

.auth-input:focus {
    border-color: #111827;
}

.auth-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #111827;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.auth-button:disabled {
    opacity: 0.6;
    cursor: default;
}

.auth-message {
    display: none;
    margin-top: 14px;
    font-size: 13px;
}

.auth-message.error {
    color: #dc2626;
}

.auth-message.success {
    color: #15803d;
}


/* =========================
   APP
========================= */

.app {
    display: none;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.header-inner {
    max-width: 1050px;
    margin: auto;
    padding: 17px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 21px;
    font-weight: 700;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.username {
    font-size: 13px;
    color: #6b7280;
}

.logout {
    background: transparent;
    border: 0;
    cursor: pointer;
    color: #6b7280;
}

.logout:hover {
    color: #111827;
}

main {
    max-width: 1050px;
    margin: auto;
    padding: 35px 20px 60px;
}


/* =========================
   ADD BOOKMARK
========================= */

.add-area {
    background: white;
    border-radius: 15px;
    padding: 18px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.04);
}

.add-row {
    display: flex;
    gap: 10px;
}

.url-input {
    flex: 1;
    padding: 14px 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    outline: none;
}

.url-input:focus {
    border-color: #111827;
}

.category-input {
    width: 180px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    outline: none;
}

.save-button {
    border: 0;
    background: #111827;
    color: white;
    padding: 0 24px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
}

.save-button:disabled {
    opacity: 0.6;
}

.app-message {
    display: none;
    margin-top: 12px;
    font-size: 13px;
}

.app-message.success {
    color: #15803d;
}

.app-message.error {
    color: #dc2626;
}


/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 28px;
}

.search-input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    background: white;
    outline: none;
}

.count {
    color: #6b7280;
    font-size: 13px;
    white-space: nowrap;
}


/* =========================
   BOOKMARKS
========================= */

.bookmarks {
    display: grid;
    gap: 10px;
    margin-top: 16px;
}

.bookmark {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px 17px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: 0.15s;
}

.bookmark:hover {
    border-color: #cbd5e1;
    transform: translateY(-1px);
}

.favicon {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    flex-shrink: 0;
}

.bookmark-main {
    flex: 1;
    min-width: 0;
}

.bookmark-title {
    display: block;
    font-weight: 600;
    text-decoration: none;
    color: #111827;
    margin-bottom: 4px;
}

.bookmark-title:hover {
    text-decoration: underline;
}

.bookmark-url {
    font-size: 13px;
    color: #6b7280;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.category {
    font-size: 12px;
    background: #f3f4f6;
    border-radius: 6px;
    padding: 6px 9px;
    color: #4b5563;
}

.empty,
.loading {
    text-align: center;
    color: #9ca3af;
    padding: 50px 20px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .add-row {
        flex-direction: column;
    }

    .category-input {
        width: 100%;
    }

    .save-button {
        padding: 13px;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .category {
        display: none;
    }

    .username {
        display: none;
    }

    main {
        padding: 22px 14px 50px;
    }
}
</style>
</head>

<body>


<!-- =========================================
     LOGIN / SIGNUP
========================================= -->

<div class="auth-screen" id="authScreen">

    <div class="auth-card">

        <h1>My Bookmarks</h1>

        <div class="auth-subtitle">
            Your bookmarks, available anywhere.
        </div>

        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                class="auth-tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>

        <input
            class="auth-input"
            id="usernameInput"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            class="auth-input"
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <input
            class="auth-input"
            id="confirmPasswordInput"
            type="password"
            placeholder="Confirm password"
            style="display:none;"
        >

        <button
            class="auth-button"
            id="authButton"
        >
            Login
        </button>

        <div
            class="auth-message"
            id="authMessage"
        ></div>

    </div>

</div>



<!-- =========================================
     BOOKMARK APP
========================================= -->

<div class="app" id="app">

    <header>

        <div class="header-inner">

            <div class="brand">
                My Bookmarks
            </div>

            <div class="header-right">

                <div
                    class="username"
                    id="currentUsername"
                ></div>

                <button
                    class="logout"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </div>

    </header>


    <main>

        <div class="add-area">

            <div class="add-row">

                <input
                    class="url-input"
                    id="urlInput"
                    type="text"
                    placeholder="Paste website address..."
                    autocomplete="off"
                >

                <input
                    class="category-input"
                    id="categoryInput"
                    type="text"
                    placeholder="Category"
                    autocomplete="off"
                >

                <button
                    class="save-button"
                    id="saveButton"
                >
                    + Save
                </button>

            </div>

            <div
                class="app-message"
                id="appMessage"
            ></div>

        </div>


        <div class="toolbar">

            <input
                class="search-input"
                id="searchInput"
                type="text"
                placeholder="Search bookmarks..."
            >

            <div
                class="count"
                id="bookmarkCount"
            ></div>

        </div>


        <div
            class="bookmarks"
            id="bookmarkList"
        ></div>

    </main>

</div>



<script>

/* ==========================================
   API
========================================== */

const API_URL =
    "https://bookmark-api.exoskel-dev.workers.dev";


/* ==========================================
   STATE
========================================== */

let authMode = "login";

let token =
    localStorage.getItem(
        "bookmark_token"
    ) || "";

let currentUser =
    localStorage.getItem(
        "bookmark_username"
    ) || "";

let bookmarks = [];


/* ==========================================
   ELEMENTS
========================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const loginTab =
    document.getElementById("loginTab");

const signupTab =
    document.getElementById("signupTab");

const usernameInput =
    document.getElementById("usernameInput");

const passwordInput =
    document.getElementById("passwordInput");

const confirmPasswordInput =
    document.getElementById(
        "confirmPasswordInput"
    );

const authButton =
    document.getElementById("authButton");

const authMessage =
    document.getElementById("authMessage");

const currentUsernameElement =
    document.getElementById(
        "currentUsername"
    );

const urlInput =
    document.getElementById("urlInput");

const categoryInput =
    document.getElementById(
        "categoryInput"
    );

const saveButton =
    document.getElementById("saveButton");

const searchInput =
    document.getElementById("searchInput");

const bookmarkCount =
    document.getElementById(
        "bookmarkCount"
    );

const bookmarkList =
    document.getElementById(
        "bookmarkList"
    );

const appMessage =
    document.getElementById("appMessage");

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* ==========================================
   AUTH TABS
========================================== */

function setAuthMode(mode) {

    authMode = mode;

    clearAuthMessage();

    if (mode === "login") {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        confirmPasswordInput.style.display =
            "none";

        authButton.textContent =
            "Login";

        passwordInput.autocomplete =
            "current-password";

    } else {

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        confirmPasswordInput.style.display =
            "block";

        authButton.textContent =
            "Create Account";

        passwordInput.autocomplete =
            "new-password";

    }
}


loginTab.addEventListener(
    "click",
    () => setAuthMode("login")
);


signupTab.addEventListener(
    "click",
    () => setAuthMode("signup")
);


/* ==========================================
   AUTH SUBMIT
========================================== */

async function submitAuth() {

    const username =
        usernameInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    clearAuthMessage();


    if (!username || !password) {

        showAuthMessage(
            "Enter your username and password.",
            "error"
        );

        return;
    }


    if (
        authMode === "signup" &&
        password !== confirmPassword
    ) {

        showAuthMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    authButton.disabled = true;

    authButton.textContent =
        authMode === "signup"
            ? "Creating..."
            : "Signing in...";


    try {

        if (authMode === "signup") {

            const signupResponse =
                await fetch(
                    API_URL + "/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


            const signupData =
                await signupResponse.json();


            if (!signupResponse.ok) {

                throw new Error(
                    signupData.error ||
                    "Could not create account"
                );
            }


            /*
             Account created.
             Now automatically login.
            */

            await performLogin(
                username,
                password
            );

        } else {

            await performLogin(
                username,
                password
            );

        }

    } catch (error) {

        showAuthMessage(
            error.message,
            "error"
        );

    } finally {

        authButton.disabled = false;

        authButton.textContent =
            authMode === "signup"
                ? "Create Account"
                : "Login";
    }
}


/* ==========================================
   LOGIN
========================================== */

async function performLogin(
    username,
    password
) {

    const response =
        await fetch(
            API_URL + "/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Login failed"
        );
    }


    token =
        data.token;

    currentUser =
        data.user.username;


    localStorage.setItem(
        "bookmark_token",
        token
    );

    localStorage.setItem(
        "bookmark_username",
        currentUser
    );


    passwordInput.value = "";

    confirmPasswordInput.value = "";


    await openApp();
}


/* ==========================================
   OPEN APP
========================================== */

async function openApp() {

    authScreen.style.display =
        "none";

    app.style.display =
        "block";


    currentUsernameElement.textContent =
        currentUser;


    await loadBookmarks();


    urlInput.focus();
}


/* ==========================================
   LOAD BOOKMARKS
========================================== */

async function loadBookmarks() {

    bookmarkList.innerHTML =
        '<div class="loading">Loading bookmarks...</div>';


    try {

        const response =
            await fetch(
                API_URL + "/bookmarks",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (response.status === 401) {

            logout();

            return;
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load bookmarks"
            );
        }


        bookmarks =
            data.bookmarks || [];


        renderBookmarks();

    } catch (error) {

        bookmarkList.innerHTML =
            '<div class="empty">Unable to load bookmarks.</div>';

        showAppMessage(
            error.message,
            "error"
        );
    }
}


/* ==========================================
   SAVE BOOKMARK
========================================== */

async function saveBookmark() {

    const url =
        urlInput.value.trim();

    let category =
        categoryInput.value.trim();


    if (!url) {

        showAppMessage(
            "Enter a website address.",
            "error"
        );

        return;
    }


    if (!category) {

        category =
            "Uncategorized";
    }


    saveButton.disabled = true;

    saveButton.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                API_URL + "/bookmarks",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        url,
                        category
                    })
                }
            );


        const data =
            await response.json();


        if (response.status === 401) {

            logout();

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save bookmark"
            );
        }


        bookmarks.unshift(
            data.bookmark
        );


        urlInput.value = "";

        categoryInput.value = "";

        searchInput.value = "";


        renderBookmarks();


        showAppMessage(
            "Bookmark saved.",
            "success"
        );


        urlInput.focus();

    } catch (error) {

        showAppMessage(
            error.message,
            "error"
        );

    } finally {

        saveButton.disabled = false;

        saveButton.textContent =
            "+ Save";
    }
}


/* ==========================================
   RENDER BOOKMARKS
========================================== */

function renderBookmarks() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        bookmarks.filter(
            bookmark => {

                const searchable =
                    (
                        (bookmark.title || "") +
                        " " +
                        (bookmark.url || "") +
                        " " +
                        (bookmark.category || "") +
                        " " +
                        (
                            Array.isArray(
                                bookmark.tags
                            )
                                ? bookmark.tags.join(" ")
                                : ""
                        )
                    )
                    .toLowerCase();


                return searchable.includes(
                    search
                );
            }
        );


    bookmarkCount.textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " bookmark"
                : " bookmarks"
        );


    if (filtered.length === 0) {

        bookmarkList.innerHTML =
            '<div class="empty">No bookmarks found.</div>';

        return;
    }


    bookmarkList.innerHTML =
        filtered.map(
            bookmark => {

                const title =
                    escapeHTML(
                        bookmark.title ||
                        getDomain(
                            bookmark.url
                        )
                    );


                const url =
                    escapeHTML(
                        bookmark.url
                    );


                const category =
                    escapeHTML(
                        bookmark.category ||
                        "Uncategorized"
                    );


                const favicon =
                    getFavicon(
                        bookmark.url
                    );


                return `
                    <div class="bookmark">

                        <img
                            class="favicon"
                            src="${favicon}"
                            alt=""
                            onerror="this.style.visibility='hidden'"
                        >

                        <div class="bookmark-main">

                            <a
                                class="bookmark-title"
                                href="${url}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                ${title}
                            </a>

                            <div class="bookmark-url">
                                ${url}
                            </div>

                        </div>

                        <div class="category">
                            ${category}
                        </div>

                    </div>
                `;

            }
        ).join("");
}


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
    "input",
    renderBookmarks
);


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem(
        "bookmark_token"
    );

    localStorage.removeItem(
        "bookmark_username"
    );


    token = "";
    currentUser = "";
    bookmarks = [];


    app.style.display =
        "none";

    authScreen.style.display =
        "flex";


    usernameInput.value = "";
    passwordInput.value = "";
    confirmPasswordInput.value = "";

    setAuthMode("login");

    usernameInput.focus();
}


/* ==========================================
   FAVICON
========================================== */

function getFavicon(url) {

    try {

        const domain =
            new URL(url).hostname;

        return (
            "https://www.google.com/s2/favicons" +
            "?domain=" +
            encodeURIComponent(domain) +
            "&sz=64"
        );

    } catch {

        return "";
    }
}


/* ==========================================
   DOMAIN
========================================== */

function getDomain(url) {

    try {

        return new URL(url)
            .hostname
            .replace(/^www\./, "");

    } catch {

        return url;
    }
}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ==========================================
   MESSAGES
========================================== */

function showAuthMessage(
    text,
    type
) {

    authMessage.textContent =
        text;

    authMessage.className =
        "auth-message " + type;

    authMessage.style.display =
        "block";
}


function clearAuthMessage() {

    authMessage.style.display =
        "none";
}


let appMessageTimer;


function showAppMessage(
    text,
    type
) {

    clearTimeout(
        appMessageTimer
    );


    appMessage.textContent =
        text;

    appMessage.className =
        "app-message " + type;

    appMessage.style.display =
        "block";


    appMessageTimer =
        setTimeout(
            () => {

                appMessage.style.display =
                    "none";

            },
            3000
        );
}


/* ==========================================
   EVENTS
========================================== */

authButton.addEventListener(
    "click",
    submitAuth
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            authMode === "login"
        ) {

            submitAuth();
        }
    }
);


confirmPasswordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            submitAuth();
        }
    }
);


saveButton.addEventListener(
    "click",
    saveBookmark
);


urlInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            saveBookmark();
        }
    }
);


logoutButton.addEventListener(
    "click",
    logout
);


/* ==========================================
   RESTORE SESSION
========================================== */

async function restoreSession() {

    if (
        token &&
        currentUser
    ) {

        await openApp();

    } else {

        authScreen.style.display =
            "flex";

        usernameInput.focus();
    }
}


restoreSession();

</script>

</body>
</html>
